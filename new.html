<!DOCTYPE html>
<html lang="da" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Hindsholm Gårdbutik</title>
<link rel="icon" href="images/hindsholmlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

    /* ============================================================
       TOKENS — grounded in the farm itself: pasture green, Jersey
       tan, and a weathered barn-red, on a cool stone-linen ground
       (deliberately not the cream/terracotta AI-default combo).
       ============================================================ */
    :root {
        --field:   #2f3a26;   /* deep pasture green — primary */
        --field-2: #232d1c;   /* darker shade, for hover/depth */
        --butter:  #d9a23f;   /* Jersey-tan gold — warm accent */
        --clay:    #9c4530;   /* weathered barn-red — sparing use */
        --paper:   #eef0e4;   /* cool stone-linen, not warm cream */
        --white:   #ffffff;
        --ink:     #23241c;
        --ink-soft:#5b5c4d;
        --line:    #dcdfd0;
        --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 32px; }

    .label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--clay);
        display: block;
        margin-bottom: 12px;
    }

    h1, h2, h3 {
        font-family: "Zilla Slab", serif;
        font-weight: 600;
        margin: 0;
        color: var(--ink);
    }

    :focus-visible { outline: 2px solid var(--field); outline-offset: 3px; }

    /* ------------------------------ Nav ------------------------------ */
    header.site-nav {
        position: sticky; top: 0; z-index: 50;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
    }

    .nav-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 20px; }

    .wordmark { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .wordmark img { height: 42px; width: auto; }
    .wordmark .name {
        font-family: "Zilla Slab", serif;
        font-weight: 600;
        font-size: 1.15rem;
        line-height: 1.15;
        color: var(--ink);
    }
    .wordmark .sub { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }

    nav.primary-links { display: flex; align-items: center; gap: 2px; }
    nav.primary-links a {
        font-size: 0.92rem;
        font-weight: 500;
        text-decoration: none;
        color: var(--ink);
        padding: 8px 14px;
        border-radius: 6px;
    }
    nav.primary-links a:hover { background: rgba(47,58,38,0.08); }

    /* language switch — a small ledger-tab control */
    .lang-switch {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        flex-shrink: 0;
    }
    .lang-switch button {
        background: var(--white);
        border: none;
        padding: 7px 13px;
        cursor: pointer;
        color: var(--ink-soft);
    }
    .lang-switch button + button { border-left: 1px solid var(--line); }
    .lang-switch button.active { background: var(--field); color: #fff; }
    .lang-switch button:hover:not(.active) { background: var(--paper); }

    .nav-right { display: flex; align-items: center; gap: 16px; }
    .menu-toggle { display: none; }

    @media (max-width: 880px) {
        nav.primary-links { display: none; }
        .menu-toggle {
            display: inline-flex; background: none; border: 1px solid var(--line);
            padding: 8px 12px; font-size: 0.85rem; cursor: pointer; border-radius: 6px;
        }
    }

    /* ------------------------------ Hero ------------------------------ */
    .hero { padding: 56px 0 0; }
    .hero .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }

    .hero-copy h1 { font-size: clamp(2.1rem, 4.4vw, 3.1rem); line-height: 1.08; margin-bottom: 18px; }
    .hero-copy p.lead { color: var(--ink-soft); font-size: 1.1rem; max-width: 44ch; margin: 0 0 28px; }

    .stamp {
        width: 108px; height: 108px;
        border-radius: 50%;
        border: 2px solid var(--field);
        outline: 1px solid var(--field);
        outline-offset: 4px;
        display: flex; align-items: center; justify-content: center;
        text-align: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--field);
        transform: rotate(-8deg);
        flex-shrink: 0;
    }
    .stamp span { display: block; }
    .stamp .big { font-family: "Zilla Slab", serif; font-size: 1.05rem; text-transform: none; letter-spacing: 0; margin: 2px 0; }

    .hero-figure { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3.1; }
    .hero-figure img { width: 100%; height: 100%; object-fit: cover; }
    .hero-figure .stamp { position: absolute; bottom: -20px; left: -20px; background: var(--paper); z-index: 2; }

    @media (max-width: 820px) {
        .hero .wrap { grid-template-columns: 1fr; }
        .hero-figure { order: -1; }
    }

    /* ------------------------------ Sections ------------------------------ */
    section { padding: 88px 0; }
    section.on-field { background: var(--field); color: #f4f4ee; }
    section.on-field h2 { color: #fff; }
    section.on-white { background: var(--white); }

    .section-head { max-width: 620px; margin-bottom: 46px; }
    .section-head h2 { font-size: clamp(1.7rem, 3.2vw, 2.3rem); }
    .section-head p { color: var(--ink-soft); margin-top: 14px; font-size: 1.05rem; }
    section.on-field .section-head p { color: rgba(244,244,238,0.75); }

    /* Product pairs */
    .product {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 54px;
        align-items: center;
        margin-bottom: 84px;
    }
    .product:last-child { margin-bottom: 0; }
    .product:nth-child(even) .product-media { order: 2; }

    .product-media { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
    .product-media img { border-radius: 12px; }
    .product-media img:first-child { aspect-ratio: 3/3.6; object-fit: cover; height: 100%; }
    .product-media img:last-child { aspect-ratio: 1/1.05; object-fit: cover; align-self: end; }

    .product-copy h3 { font-size: 1.6rem; margin-bottom: 16px; }
    .product-copy p { color: var(--ink-soft); font-size: 1.02rem; margin: 0; }

    @media (max-width: 780px) {
        .product, .product:nth-child(even) .product-media { grid-template-columns: 1fr; order: 0; }
    }

    /* Duo image blocks (fruit/veg, animals) */
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }
    .duo img { border-radius: 12px; aspect-ratio: 4/3.2; object-fit: cover; }
    .duo-copy { max-width: 70ch; color: var(--ink-soft); font-size: 1.04rem; }

    @media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }

    /* Restaurant band */
    .restaurant-band { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .restaurant-band img { border-radius: 14px; aspect-ratio: 4/3; object-fit: cover; }
    .restaurant-copy .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
    .btn {
        font-weight: 600; font-size: 0.92rem; text-decoration: none;
        padding: 13px 24px; border-radius: 8px; display: inline-block;
    }
    .btn-gold { background: var(--butter); color: var(--field-2); }
    .btn-gold:hover { background: #c8933a; }
    .btn-outline { border: 1px solid rgba(244,244,238,0.5); color: #fff; }
    .btn-outline:hover { border-color: #fff; }
    @media (max-width: 780px) { .restaurant-band { grid-template-columns: 1fr; } }

    /* The Farm */
    .farm-block { display: grid; grid-template-columns: 1fr 1fr; gap: 54px; align-items: center; }
    .farm-block img { border-radius: 14px; aspect-ratio: 4/3.1; object-fit: cover; }
    .farm-copy p { color: var(--ink-soft); font-size: 1.04rem; }
    .farm-logos { display: flex; align-items: center; gap: 18px; margin-top: 24px; }
    .farm-logos img { height: 46px; width: auto; border-radius: 0; }
    @media (max-width: 780px) { .farm-block { grid-template-columns: 1fr; } }

    /* About us */
    .about-block { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 54px; align-items: center; }
    .about-block img { border-radius: 14px; aspect-ratio: 4/3.4; object-fit: cover; }
    .about-copy p { color: var(--ink-soft); font-size: 1.06rem; }
    .signoff { font-family: "Zilla Slab", serif; font-style: italic; font-size: 1.15rem; margin-top: 22px; color: var(--ink); }
    @media (max-width: 780px) { .about-block { grid-template-columns: 1fr; } }

    /* Footer */
    footer.site-footer { background: var(--field-2); color: rgba(244,244,238,0.85); padding: 56px 0 30px; }
    .footer-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
    footer .label { color: var(--butter); }
    footer p { margin: 4px 0; font-size: 0.95rem; color: rgba(244,244,238,0.72); }
    .footer-social { display: flex; gap: 14px; margin-top: 6px; }
    .footer-social img { height: 22px; width: 22px; filter: brightness(0) invert(1); opacity: 0.75; }
    .footer-social img:hover { opacity: 1; }
    .footer-partner { display: flex; align-items: center; gap: 12px; }
    .footer-partner img { height: 34px; width: auto; }
    .footer-bottom { border-top: 1px solid rgba(244,244,238,0.15); padding-top: 22px; font-size: 0.82rem; color: rgba(244,244,238,0.5); }
    @media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; } }

</style>
</head>
<body>

    <header class="site-nav">

                <img src="images/hindsholmlogo.png" alt="Hindsholm Gårdbutik">

                    <span class="name">Hindsholm</span><br>

                <div class="product-media">

    <!-- ============================== FRUIT & VEG ============================= -->

            <p class="duo-copy" data-i18n="garden.p"></p>
        </div>

                <span class="label" data-i18n="animals.label"></span>

            </div>
            <div class="duo">

    <!-- ============================== RESTAURANT ============================= -->

                <h2 data-i18n="restaurant.h2"></h2>
                <p style="color:rgba(244,244,238,0.78); margin-top:14px;" data-i18n="restaurant.p"></p>

                    <a class="btn btn-gold" href="https://staalbaek.dk/menu-online/index.html" data-i18n="restaurant.menu"></a>

            <img src="images/withframe/benlou.png" alt="Benjamin og Louise på Stålbækgård">
            <div class="about-copy">

    <!-- ================================ FOOTER ================================ -->

    <script>
        var translations = {
            da: {
                "nav.products": "Produkter", "nav.garden": "Frugt og grønt", "nav.animals": "Dyrene",
                "nav.restaurant": "Restaurant", "nav.farm": "Gården", "nav.about": "Om os",
                "hero.label": "Fynshovedvej 584 · Martofte", "hero.h1": "Velkommen til Hindsholm Gårdbutik",
                "hero.lead": "CO₂-neutralt oksekød, økologiske grøntsager og hjemmelavet mockduck — dyrket og opdrættet med god tid, lige her på Stålbækgård.",
                "hero.cta": "Se vores produkter", "hero.stamp": "Neutralt",
                "products.label": "Produkter", "products.h2": "Fra jord og stald til din tallerken",
                "beef.h3": "CO2 Neutral Beef / CO2 Neutralt Oksekød",
                "beef.p": "Her på gården har vi jerseykøer. Vi bruger dem ikke til at producere mælk, selvom jersey koen er fremragende til det. Vi har i stedet et par amme tanter som er pensioneret malkekøer, de passer på deres egne kalve samt adopterede tyrekalve som ikke har værdi i mælkeproduktionen. Vi slagter vores ungtyre når de er ca. 1-2 år gamle og de giver et fantastisk stykke kød. Grunden til at jersey koen ikke er klassificeret som et kødkvæg er ikke at de ikke laver et godt stykke kød, men at de ikke laver nok kød hurtigt nok. Men her på gården har vi god tid. Og når kødet får god tid til at vokse, fordi dyret ikke vokser så hurtigt, så får det massere af smag og saft. Samtidig har jersey køerne en kortere fiberstruktur end andre køer hvilket giver et rigtig meget mørt kød. Mørt, saftigt og smagfuldt kød, bedre bliver det ikke. Vi kalder det Hindsholm Beef.",
                "duck.h3": "Økologisk Mock Duck",
                "duck.p": "Vi har også noget til dem som ikke spiser kød. Vi har nemlig udviklet vores egen økologiske mockduck som vi også sælger i butikken. Du kan også besøge Duck'n Fries og få os til at tilberede det for dig!",
                "garden.label": "Frugt og grønt", "garden.h2": "Dyrket i balance med jorden",
                "garden.p": "Vi dyrker et væld af forskellige frugter og grøntsager her på gården. Tingene gror mellem hinanden og i balancerede mængder så der ikke opstår større områder med monokulturer som er uhensigtsmæssigt for planterne og jorden. Vi sprøjter ikke afgrøderne og gøder så vidt muligt med gødning fra dyrene. Afgrøderne sås og luges via håndkraft, og vi arbejder på en model der er tæt på naturens egen så arbejdsmængden ikke vokser os over hovedet. Drivhuset, som vi har bygget af genbrugsmaterialer, giver ekstra varme til tomater og basilikum, og chiliplanterne får i år deres eget lille væksthus.",
                "animals.label": "De øvrige dyr", "animals.h2": "Resten af besætningen",
                "animals.p": "Udover de dyr som indgår i produktionen har vi på gården også et vekslende antal katte som alle er ansat med kost og logi, deres arbejde består i at holde bestanden af mus mm nede hvilket de gør yderst professionelt. Hunden Ellie holder et åbent øje med alt hvad der foregår på gården. Hun er en glad og godmodig hund der elsker katte og høns.",
                "restaurant.label": "Restaurant", "restaurant.h2": "Benji's Burger",
                "restaurant.p": "Kom forbi og smag Hindsholm Beef tilberedt på vores egen restaurant.",
                "restaurant.menu": "Se menu", "restaurant.site": "Se hjemmeside",
                "farm.label": "Gården", "farm.h2": "Stålbækgård",
                "farm.p": "Gården, som Hindsholm Gårdbutik & Delikatesse er en del af, hedder Stålbækgård. Det er en over 200 år gammel udflyttergård fra Martofte, som vi overtog i 2013. Vi er i gang med nænsomt at renovere gården samtidig med at vi udvikler og plejer gårdbutikken, dyre-besætningen og dyrkningen af afgrøder. Arbejdet med hovedbygningen træder ofte lidt i baggrunden, så dyrene, afgrøderne, butikken og selvfølgelig kunderne får den kærlighed og opmærksomhed der skal til.",
                "about.label": "Om os", "about.h2": "Louise &amp; Benjamin",
                "about.p": "Vi er et Dansk Engelsk landbrug, med egen gårdbutik og køkken, der har meldt afbud til det travle liv i byen for at forene os i kærligheden til god mad og naturen. Vi er specialister i opdræt af det lykkeligste kød. Vi sætter en ære i at fremelske nye udskæringer og opskrifter, inspireret af hele verden, og går gerne i køkkenet for at gøre din hverdag lidt mere bekvemmelig. Vi synes at du og din familie fortjener et godt måltid — altid. Lavet med omhu, fyldt med smag og uden hverken unødig emballage, spild eller transport. Helt naturligt, helt enkelt - sund fornuft!",
                "about.signoff": "Kærlig hilsen Louise og Benjamin",
                "footer.social_label": "Følg os", "footer.social_p": "Find os på facebook og instagram",
                "footer.address_label": "Adresse", "footer.partner_label": "Vi er en del af"

            en: {

                "hero.lead": "CO₂-neutrales Rindfleisch, Bio-Gemüse und hausgemachte Mockduck — mit viel Zeit angebaut und aufgezogen, direkt hier auf Stålbækgård.",

                "beef.p": "Hier auf dem Hof halten wir Jersey-Kühe. Wir nutzen sie nicht zur Milchproduktion, obwohl die Jersey-Kuh dafür hervorragend geeignet wäre. Stattdessen haben wir ein paar „Ammentanten" – pensionierte Milchkühe –, die sich um ihre eigenen Kälber sowie um adoptierte Bullenkälber kümmern, die für die Milchproduktion keinen Wert haben. Wir schlachten unsere Jungbullen im Alter von etwa 1–2 Jahren, und sie liefern ein fantastisches Stück Fleisch. Der Grund, warum die Jersey-Kuh nicht als Fleischrind eingestuft wird, ist nicht, dass sie kein gutes Fleisch liefert, sondern dass sie nicht schnell genug genug Fleisch produziert. Aber hier auf dem Hof haben wir Zeit. Und wenn dem Fleisch Zeit zum Wachsen gegeben wird, weil das Tier nicht so schnell wächst, bekommt es viel Geschmack und Saftigkeit. Gleichzeitig haben Jersey-Kühe eine kürzere Faserstruktur als andere Rinder, was ein besonders zartes Fleisch ergibt. Zart, saftig und geschmackvoll – besser geht es nicht. Wir nennen es Hindsholm Beef.",

                "garden.p": "Wir bauen auf dem Hof eine Vielzahl unterschiedlicher Obst- und Gemüsesorten an. Die Pflanzen wachsen durcheinander und in ausgewogenen Mengen, sodass keine größeren Monokulturflächen entstehen, die für Pflanzen und Boden ungünstig wären. Wir spritzen unsere Kulturen nicht und düngen so weit wie möglich mit Mist von unseren eigenen Tieren. Ausgesät und gejätet wird von Hand, und wir arbeiten an einem Modell, das sich eng an der Natur orientiert, damit der Arbeitsaufwand uns nicht über den Kopf wächst. Das Gewächshaus, das wir aus recycelten Materialien gebaut haben, spendet Tomaten und Basilikum zusätzliche Wärme, und die Chilipflanzen bekommen dieses Jahr ihr eigenes kleines Gewächshaus.",

                "farm.p": "Der Hof, zu dem der Hindsholm Gårdbutik & Delikatesse gehört, heißt Stålbækgård. Es handelt sich um einen über 200 Jahre alten Aussiedlerhof aus Martofte, den wir 2013 übernommen haben. Wir renovieren den Hof behutsam, während wir gleichzeitig den Hofladen, den Tierbestand und den Anbau pflegen und weiterentwickeln. Die Arbeit am Haupthaus tritt dabei oft in den Hintergrund, damit die Tiere, die Feldfrüchte, der Laden – und natürlich die Kunden – die Liebe und Aufmerksamkeit bekommen, die es braucht.",

        function applyLanguage(lang) {
            var dict = translations[lang] || translations.da;
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                var key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.innerHTML = dict[key];
            });
            document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
            });
            document.getElementById('html-root').setAttribute('lang', lang);
            try { localStorage.setItem('hindsholm-lang', lang); } catch (e) {}
        }

        document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
            btn.addEventListener('click', function () { applyLanguage(btn.getAttribute('data-lang-btn')); });
        });

        var savedLang = 'da';
        try { savedLang = localStorage.getItem('hindsholm-lang') || 'da'; } catch (e) {}
        applyLanguage(savedLang);

        var mobileToggle = document.getElementById('mobileToggle');
        var primaryNav = document.getElementById('primaryNav');
        mobileToggle.addEventListener('click', function () {
            var open = primaryNav.style.display === 'flex';
            primaryNav.style.display = open ? 'none' : 'flex';
            primaryNav.style.flexDirection = 'column';
            primaryNav.style.position = 'absolute';
            primaryNav.style.top = '100%';
            primaryNav.style.left = '0';
            primaryNav.style.right = '0';
            primaryNav.style.background = 'var(--paper)';
            primaryNav.style.borderTop = '1px solid var(--line)';
            primaryNav.style.padding = '10px 20px 16px';
            mobileToggle.setAttribute('aria-expanded', String(!open));
        });
    </script>
