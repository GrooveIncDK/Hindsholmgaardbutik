<!DOCTYPE html>
<html lang="da" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Hindsholm Gårdbutik</title>
<link rel="icon" href="images/hindsholmlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

    /* ============================================================
       TOKENS — grounded in the farm itself: pasture green, Jersey
       tan, and a weathered barn-red, on a cool stone-linen ground
       (deliberately not the cream/terracotta AI-default combo).
       ============================================================ */
    :root {
        --field:   #2f3a26;   /* deep pasture green — primary */
        --field-2: #232d1c;   /* darker shade, for hover/depth */
        --butter:  #d9a23f;   /* Jersey-tan gold — warm accent */
        --clay:    #9c4530;   /* weathered barn-red — sparing use */
        --paper:   #eef0e4;   /* cool stone-linen, not warm cream */
        --white:   #ffffff;
        --ink:     #23241c;
        --ink-soft:#5b5c4d;
        --line:    #dcdfd0;
        --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 32px; }

    .label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--clay);
        display: block;
        margin-bottom: 12px;
    }

    h1, h2, h3 {
        font-family: "Zilla Slab", serif;
        font-weight: 600;
        margin: 0;
        color: var(--ink);
    }

    :focus-visible { outline: 2px solid var(--field); outline-offset: 3px; }

    /* ------------------------------ Nav ------------------------------ */
    header.site-nav {
        position: sticky; top: 0; z-index: 50;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
    }

    .nav-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 20px; }

    .wordmark { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .wordmark img { height: 42px; width: auto; }
    .wordmark .name {
        font-family: "Zilla Slab", serif;
        font-weight: 600;
        font-size: 1.15rem;
        line-height: 1.15;
        color: var(--ink);
    }
    .wordmark .sub { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }

    nav.primary-links { display: flex; align-items: center; gap: 2px; }
    nav.primary-links a {
        font-size: 0.92rem;
        font-weight: 500;
        text-decoration: none;
        color: var(--ink);
        padding: 8px 14px;
        border-radius: 6px;
    }
    nav.primary-links a:hover { background: rgba(47,58,38,0.08); }

    /* language switch — a small ledger-tab control */
    .lang-switch {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        flex-shrink: 0;
    }
    .lang-switch button {
        background: var(--white);
        border: none;
        padding: 7px 13px;
        cursor: pointer;
        color: var(--ink-soft);
    }
    .lang-switch button + button { border-left: 1px solid var(--line); }
    .lang-switch button.active { background: var(--field); color: #fff; }
    .lang-switch button:hover:not(.active) { background: var(--paper); }

    .nav-right { display: flex; align-items: center; gap: 16px; }
    .menu-toggle { display: none; }

    @media (max-width: 880px) {
        nav.primary-links { display: none; }
        .menu-toggle {
            display: inline-flex; background: none; border: 1px solid var(--line);
            padding: 8px 12px; font-size: 0.85rem; cursor: pointer; border-radius: 6px;
        }
    }

    /* ------------------------------ Hero ------------------------------ */
    .hero { padding: 56px 0 0; }
    .hero .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }

    .hero-copy h1 { font-size: clamp(2.1rem, 4.4vw, 3.1rem); line-height: 1.08; margin-bottom: 18px; }
    .hero-copy p.lead { color: var(--ink-soft); font-size: 1.1rem; max-width: 44ch; margin: 0 0 28px; }

    .btn {
        font-weight: 600; font-size: 0.92rem; text-decoration: none;
        padding: 13px 24px; border-radius: 8px; display: inline-block;
    }
    .btn-gold { background: var(--butter); color: var(--field-2); }
    .btn-gold:hover { background: #D9A23F; }
    .btn-outline { border: 1px solid rgba(244,244,238,0.5); color: #fff; }
    .btn-outline:hover { border-color: #fff; }

    .stamp {
        width: 118px;
        height: auto;
        flex-shrink: 0;
        filter: drop-shadow(0 6px 14px rgba(35,45,28,0.25));
    }
    .stamp img { width: 100%; height: auto; display: block; }

    .hero-figure {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        aspect-ratio: 4/3.1;
        box-shadow: 0 18px 40px -20px rgba(35,45,28,0.35);
    }
    .hero-figure img { width: 100%; height: 100%; object-fit: cover; }
    .hero-figure .stamp { position: absolute; bottom: -18px; left: -18px; z-index: 2; }

    @media (max-width: 820px) {
        .hero .wrap { grid-template-columns: 1fr; }
        .hero-figure { order: -1; }
    }

    /* ------------------------------ Sections ------------------------------ */
    section { padding: 88px 0; }
    section.on-field { background: var(--field); color: #f4f4ee; }
    section.on-field h2 { color: #fff; }
    section.on-white { background: var(--white); }

    .section-head { max-width: 620px; margin-bottom: 46px; }
    .section-head h2 { font-size: clamp(1.7rem, 3.2vw, 2.3rem); }
    .section-head p { color: var(--ink-soft); margin-top: 14px; font-size: 1.05rem; }
    section.on-field .section-head p { color: rgba(244,244,238,0.75); }

    /* Produce grid — three real products, evenly cropped */
    .produce-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
    }
    .produce-card {
        background: var(--white);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 26px -18px rgba(35,45,28,0.4);
    }
    .produce-card .shot { aspect-ratio: 4/3.3; overflow: hidden; }
    .produce-card .shot img { width: 100%; height: 100%; object-fit: cover; }
    .produce-card .info { padding: 22px 22px 26px; }
    .produce-card h3 { font-size: 1.28rem; margin-bottom: 10px; }
    .produce-card p { color: var(--ink-soft); font-size: 0.98rem; margin: 0; }

    @media (max-width: 780px) {
        .produce-grid { grid-template-columns: 1fr; }
    }

    /* Evolution intro band */
    .evolution { background: var(--white); text-align: center; padding: 64px 0; }
    .evolution .wrap { max-width: 720px; }
    .evolution p { color: var(--ink-soft); font-size: 1.08rem; margin-top: 14px; }

    /* Duo image blocks (fruit/veg) */
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; align-items: center; }
    .duo img {
        border-radius: 12px;
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        background: var(--white);
        padding: 14px;
    }
    .duo-copy { max-width: 70ch; color: var(--ink-soft); font-size: 1.04rem; }

    @media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }

    /* Visit the stand band */
    .stand-band { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .stand-band .stand-figure { border-radius: 14px; overflow: hidden; aspect-ratio: 4/3.2; box-shadow: 0 14px 34px -18px rgba(0,0,0,0.4); }
    .stand-band .stand-figure img { width: 100%; height: 100%; object-fit: cover; }
    .stand-copy .price-line {
        display: inline-block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.85rem;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(244,244,238,0.3);
        border-radius: 999px;
        padding: 8px 16px;
        margin-top: 18px;
    }
    .stand-copy .insta-line { display: block; margin-top: 16px; font-size: 0.92rem; color: rgba(244,244,238,0.75); }
    .stand-copy .insta-line a { color: var(--butter); text-decoration: none; font-weight: 600; }
    .stand-copy .insta-line a:hover { text-decoration: underline; }
    @media (max-width: 780px) { .stand-band { grid-template-columns: 1fr; } }

    /* Organic & CO2 neutral */
    .organic-block { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 54px; align-items: center; }
    .organic-media { position: relative; }
    .organic-media img.label-shot {
        width: 100%;
        max-height: 380px;
        object-fit: contain;
        background: var(--paper);
        border-radius: 14px;
        padding: 18px;
    }
    .organic-media .stamp { position: absolute; bottom: -16px; right: -16px; width: 92px; }
    .organic-copy p { color: var(--ink-soft); font-size: 1.05rem; }
    @media (max-width: 780px) { .organic-block { grid-template-columns: 1fr; } .organic-media .stamp { right: 12px; } }

    /* The Farm */
    .farm-block { display: grid; grid-template-columns: 1fr 1fr; gap: 54px; align-items: center; }
    .farm-block img {
        border-radius: 14px;
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        background: var(--white);
        padding: 18px;
    }
    .farm-copy p { color: var(--ink-soft); font-size: 1.04rem; }
    .farm-logos { display: flex; align-items: center; gap: 18px; margin-top: 24px; }
    .farm-logos img { height: 46px; width: auto; border-radius: 0; }
    @media (max-width: 780px) { .farm-block { grid-template-columns: 1fr; } }

    /* About us */
    .about-block { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 54px; align-items: center; }
    .about-block img {
        border-radius: 14px;
        width: 100%;
        max-height: 380px;
        object-fit: contain;
        background: var(--paper);
        padding: 18px;
    }
    .about-copy p { color: var(--ink-soft); font-size: 1.06rem; }
    .signoff { font-family: "Zilla Slab", serif; font-style: italic; font-size: 1.15rem; margin-top: 22px; color: var(--ink); }
    @media (max-width: 780px) { .about-block { grid-template-columns: 1fr; } }

    /* Footer */
    footer.site-footer { background: var(--field-2); color: rgba(244,244,238,0.85); padding: 26px 0 14px; }
    .footer-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 32px; align-items: center; margin-bottom: 16px; }
    footer .label { color: var(--butter); }
    footer p { margin: 4px 0; font-size: 0.95rem; color: rgba(244,244,238,0.72); }
    .footer-social { display: flex; gap: 14px; margin-top: 6px; }
    .footer-social img { height: 22px; width: 22px; filter: brightness(0) invert(1); opacity: 0.75; }
    .footer-social img:hover { opacity: 1; }
    .footer-partner { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .footer-partner img { height: 100px; width: auto; object-fit: contain; }
    .footer-bottom { border-top: 1px solid rgba(244,244,238,0.15); padding-top: 12px; font-size: 0.78rem; color: rgba(244,244,238,0.5); text-align: center; }
    @media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; text-align: left; } .footer-partner { align-items: flex-start; } }

</style>
</head>

                "garden.p": "Wir bauen auf dem Hof eine Vielzahl unterschiedlicher Obst- und Gemüsesorten an. Die Pflanzen wachsen durcheinander und in ausgewogenen Mengen, sodass keine größeren Monokulturflächen entstehen, die für Pflanzen und Boden ungünstig wären. Wir spritzen unsere Kulturen nicht und düngen so weit wie möglich mit natürlichem Dünger. Ausgesät und gejätet wird von Hand, und wir arbeiten an einem Modell, das sich eng an der Natur orientiert, damit der Arbeitsaufwand uns nicht über den Kopf wächst. Das Gewächshaus, das wir aus recycelten Materialien gebaut haben, spendet Tomaten und Basilikum zusätzliche Wärme, und die Chilipflanzen bekommen dieses Jahr ihr eigenes kleines Gewächshaus.",

        function applyLanguage(lang) {
            var dict = translations[lang] || translations.da;
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                var key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.innerHTML = dict[key];
            });
            document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
            });
            document.getElementById('html-root').setAttribute('lang', lang);
            try { localStorage.setItem('hindsholm-lang', lang); } catch (e) {}
        }

        document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
            btn.addEventListener('click', function () { applyLanguage(btn.getAttribute('data-lang-btn')); });
        });

        var savedLang = 'da';
        try { savedLang = localStorage.getItem('hindsholm-lang') || 'da'; } catch (e) {}
        applyLanguage(savedLang);

        var mobileToggle = document.getElementById('mobileToggle');
        var primaryNav = document.getElementById('primaryNav');
        mobileToggle.addEventListener('click', function () {
            var open = primaryNav.style.display === 'flex';
            primaryNav.style.display = open ? 'none' : 'flex';
            primaryNav.style.flexDirection = 'column';
            primaryNav.style.position = 'absolute';
            primaryNav.style.top = '100%';
            primaryNav.style.left = '0';
            primaryNav.style.right = '0';
            primaryNav.style.background = 'var(--paper)';
            primaryNav.style.borderTop = '1px solid var(--line)';
            primaryNav.style.padding = '10px 20px 16px';
            mobileToggle.setAttribute('aria-expanded', String(!open));
        });
    </script>
